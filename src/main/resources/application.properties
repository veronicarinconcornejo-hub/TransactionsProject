spring.application.name=transactions

spring.data.mongodb.uri=mongodb://localhost:27017/test
spring.data.mongodb.auto-index-creation=true

resilience4j.retry.instances.paymentProvider.max-attempts=10
resilience4j.retry.instances.paymentProvider.wait-duration=3s
resilience4j.retry.instances.paymentProvider.retry-exceptions=com.financial.transactions.exceptions.ProviderException

resilience4j.circuitbreaker.instances.paymentProvider.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.paymentProvider.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentProvider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentProvider.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentProvider.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.paymentProvider.record-exceptions=com.financial.transactions.exceptions.ProviderException

logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.retry=DEBUG

security.api-key=${API_KEY:ApiKeyExam}
provider.api-key=${PROVIDER_API_KEY:dev-provider-key}

provider.base-url=http://localhost:8081